<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinAutoFlow — Pinterest Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">
          <span class="logo-pin">📌</span>
        </div>
        <div class="logo-text">
          <div class="logo-name">PinAutoFlow</div>
          <div class="logo-tagline">Affiliate Automation</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Overview</div>
        <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          Dashboard
        </a>

        <div class="nav-section-label">Automation</div>
        <a class="nav-item" data-page="research" onclick="navigate('research')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11z" stroke="currentColor" stroke-width="1.5"/><path d="M16.5 16.5l-3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Market Research
          <span class="nav-badge">Auto</span>
        </a>
        <a class="nav-item" data-page="products" onclick="navigate('products')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          My Products
        </a>
        <a class="nav-item" data-page="content" onclick="navigate('content')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M4 4h12v3H4zM4 10h8M4 14h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Content Studio
          <span class="nav-badge">AI</span>
        </a>
        <a class="nav-item" data-page="schedule" onclick="navigate('schedule')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 2v3M13 2v3M3 9h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Scheduler
        </a>

        <a class="nav-item" data-page="affiliate" onclick="navigate('affiliate')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M2 10h16M10 3c-2 2.5-2 11.5 0 14M10 3c2 2.5 2 11.5 0 14" stroke="currentColor" stroke-width="1.5"/></svg>
          Global Affiliate
          <span class="nav-badge">New</span>
        </a>

        <div class="nav-section-label">Insights</div>
        <a class="nav-item" data-page="analytics" onclick="navigate('analytics')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 14l4-5 4 3 4-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 17h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Performance
        </a>
        <a class="nav-item" data-page="settings" onclick="navigate('settings')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 3v1.5M10 15.5V17M3 10h1.5M15.5 10H17M4.93 4.93l1.06 1.06M14.01 14.01l1.06 1.06M4.93 15.07l1.06-1.06M14.01 5.99l1.06-1.06" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="plan-card">
          <div class="plan-label">Free Plan</div>
          <div class="plan-usage">
            <div class="plan-bar"><div class="plan-bar-fill" style="width:60%"></div></div>
            <span class="plan-count">3 / 5 pins today</span>
          </div>
        </div>
        <div class="status-dot-row">
          <span class="status-dot online"></span>
          <span class="status-text">All systems running</span>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main" id="main">
      <!-- Pages injected here by JS -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
